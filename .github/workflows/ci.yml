name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; cancel superseded runs. Avoids duplicate push+PR runs on
# feature branches (the pull_request event already covers open PRs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + offline tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: PSScriptAnalyzer (fail on errors)
        shell: pwsh
        run: |
          $results  = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results += Invoke-ScriptAnalyzer -Path ./bootstrap.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) { $results | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize | Out-String | Write-Host }
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Host ("Analyzer findings: {0} (errors: {1})" -f @($results).Count, $errors.Count)
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer reported $($errors.Count) error(s)." }

      - name: Pester (offline, fixtures only)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'TestResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults.xml
          if-no-files-found: ignore
