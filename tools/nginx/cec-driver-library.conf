# CEC-Autosetup driver-library LAN mirror - nginx site.
# Serves the built library (index.json + driver files) on the LAN. nginx runs as
# its own systemd service (nginx.service). See docs/driver-library.md.
#
#   sudo cp tools/nginx/cec-driver-library.conf /etc/nginx/sites-available/cec-driver-library
#   sudo ln -s /etc/nginx/sites-available/cec-driver-library /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Clients then use:  bootstrap.ps1 -Mirror http://<this-host>:8080

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/cec-drivers;        # = the Build-DriverLibrary.ps1 output dir
    default_type application/octet-stream;   # driver files; client verifies by hash
    autoindex on;                 # optional: lets a human browse the tree

    # index.json + every mirrored file are plain static gets.
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Lock writes/methods down to reads.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
}
